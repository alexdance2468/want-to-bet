<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Want to Bet</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0;color:#222}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}
  input,button{font:inherit;padding:8px;margin:3px 0;border-radius:6px;border:1px solid #ccc}
  input{width:100%;box-sizing:border-box}
  button{background:#2563eb;color:#fff;border:0;cursor:pointer}
  button.grey{background:#6b7280}
  .row{display:flex;gap:8px}
  .row button{flex-shrink:0}
  .small{color:#666;font-size:.9em}
  h1{margin-bottom:0}
  .sub{color:#666;margin-bottom:12px}
</style>
</head>
<body>
<main>
  <h1>Want to Bet</h1>
  <div class="sub">by Alex Dance</div>

  <div class="card">
    <b>Your name</b>
    <input id="name" placeholder="Type your name (used for offers and bets)" maxlength="30">
  </div>

  <div class="card">
    <b>Make an offer</b>
    <input id="stmt" placeholder="I say that... (e.g. It will rain in Sydney on Saturday)" maxlength="200">
    <div class="row">
      <input id="odds" type="number" min="0.1" step="0.1" placeholder="Odds (2 = pay 2 per 1 bet)">
      <input id="max" type="number" min="1" placeholder="Most you'll pay out">
    </div>
    <div class="small">Odds 2 means: if someone bets 1 and you lose, you pay out 2. "Most you'll pay out" is your total limit across everyone who bets.</div>
    <button onclick="makeOffer()">Post offer</button>
  </div>

  <h2>Open offers</h2><div id="open"></div>
  <h2>Settled bets</h2><div id="done"></div>
  <h2>Leaderboard</h2><div id="board" class="card"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://gsmeyqbwjfnxnigaharo.supabase.co', 'sb_publishable_l8W85pYer3OiYE5acsCRhQ_bCcTWO9z');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let token = store.get('wtb_token', null);
if (!token) {
  token = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  store.set('wtb_token', token);
}
let mine = store.get('wtb_mine', []);
$('name').value = store.get('wtb_name', '');
$('name').onchange = () => store.set('wtb_name', $('name').value.trim());

function myName() {
  const n = $('name').value.trim();
  if (!n) { alert('Type your name at the top first'); return null; }
  store.set('wtb_name', n);
  return n;
}

async function makeOffer() {
  const name = myName(); if (!name) return;
  const odds = parseFloat($('odds').value), max = parseInt($('max').value);
  if (!$('stmt').value.trim()) return alert('Write what you are betting on');
  if (!(odds > 0) || !(max > 0)) return alert('Enter the odds and the most you will pay out');
  const { data, error } = await sb.rpc('create_offer', {
    p_name: name, p_statement: $('stmt').value, p_odds: odds, p_max: max, p_token: token
  });
  if (error) return alert(error.message);
  mine.push(data); store.set('wtb_mine', mine);
  $('stmt').value = ''; $('odds').value = ''; $('max').value = '';
  load();
}

async function take(id) {
  const name = myName(); if (!name) return;
  const stake = parseInt($('s' + id).value);
  if (!(stake > 0)) return alert('Enter how much you want to bet');
  const { error } = await sb.rpc('take_offer', { p_id: id, p_name: name, p_stake: stake });
  if (error) alert(error.message);
  load();
}

async function owner(fn, id, extra = {}) {
  const { error } = await sb.rpc(fn, { p_id: id, p_token: token, ...extra });
  if (error) alert(error.message);
  load();
}

async function load() {
  const [b, t] = await Promise.all([
    sb.from('bets').select('*').order('id', { ascending: false }),
    sb.from('takes').select('*').order('id')
  ]);
  if (b.error || t.error) return;
  const bets = b.data, takes = t.data;

  const byBet = {};
  takes.forEach(k => (byBet[k.bet_id] = byBet[k.bet_id] || []).push(k));

  const net = {}, label = {};
  const add = (n, v) => { const k = n.toLowerCase(); label[k] = label[k] || n; net[k] = (net[k] || 0) + v; };
  bets.filter(x => x.status === 'settled').forEach(x => (byBet[x.id] || []).forEach(k => {
    if (x.creator_won) { add(x.creator, k.stake); add(k.taker, -k.stake); }
    else { add(x.creator, -k.payout); add(k.taker, k.payout); }
  }));

  const card = x => {
    const ts = byBet[x.id] || [];
    const left = x.max_payout - ts.reduce((s, k) => s + k.payout, 0);
    const maxStake = Math.floor(left / x.odds + 1e-9);
    let h = `<div class="card"><b>${esc(x.creator)} says:</b> ${esc(x.statement)}
      <div class="small">Pays ${Number(x.odds)} for every 1 bet · ${left} of ${x.max_payout} still available</div>`;
    h += ts.map(k => `<div class="small">• ${esc(k.taker)} bet ${k.stake} to win ${k.payout}</div>`).join('');
    if (x.status === 'open') {
      h += maxStake >= 1
        ? `<div class="row"><input id="s${x.id}" type="number" min="1" max="${maxStake}" placeholder="Your bet (up to ${maxStake})"><button onclick="take(${x.id})">Bet</button></div>`
        : '<div class="small"><b>Fully taken</b></div>';
      if (mine.includes(x.id)) {
        h += ts.length
          ? `<div class="row"><button onclick="if(confirm('Confirm: you WON this bet?'))owner('settle_offer',${x.id},{p_creator_won:true})">I won</button>
             <button class="grey" onclick="if(confirm('Confirm: you LOST this bet?'))owner('settle_offer',${x.id},{p_creator_won:false})">I lost</button></div>`
          : `<button class="grey" onclick="owner('cancel_offer',${x.id})">Cancel offer</button>`;
      }
    } else {
      h += `<div class="small"><b>Result: ${esc(x.creator)} ${x.creator_won ? 'won' : 'lost'}</b></div>`;
    }
    return h + '</div>';
  };

  $('open').innerHTML = bets.filter(x => x.status === 'open').map(card).join('') || '<p class="small">No open offers yet. Make the first one!</p>';
  $('done').innerHTML = bets.filter(x => x.status === 'settled').map(card).join('') || '<p class="small">Nothing settled yet.</p>';
  $('board').innerHTML = Object.keys(net).sort((a, c) => net[c] - net[a])
    .map(k => `<div>${esc(label[k])}: ${net[k] > 0 ? '+' : ''}${net[k]}</div>`).join('') || '<span class="small">No settled bets yet.</span>';
}

setInterval(() => { if (document.activeElement.tagName !== 'INPUT') load(); }, 15000);
load();
</script>
</body>
</html>
