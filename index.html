<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fake Bets</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0;color:#222}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:10px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0002}
  input,button{font:inherit;padding:8px;margin:3px 0;border-radius:6px;border:1px solid #ccc}
  input{width:100%;box-sizing:border-box}
  button{background:#2563eb;color:#fff;border:0;cursor:pointer}
  button.grey{background:#6b7280}
  .row{display:flex;gap:8px}
  .small{color:#666;font-size:.9em}
  header{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<main>
  <h1>🎲 Fake Bets</h1>

  <div id="auth" class="card" hidden>
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password (6+ characters)">
    <input id="uname" placeholder="Username (only needed to sign up)">
    <div class="row">
      <button onclick="login()">Log in</button>
      <button class="grey" onclick="signup()">Sign up</button>
    </div>
  </div>

  <div id="app" hidden>
    <header>
      <div><b id="who"></b> · net <b id="net"></b> coins</div>
      <button class="grey" onclick="sb.auth.signOut()">Log out</button>
    </header>

    <div class="card">
      <b>Make an offer</b>
      <input id="stmt" placeholder="I say that... (e.g. It will rain in Sydney on Saturday)">
      <div class="row">
        <input id="stake" type="number" min="1" placeholder="Your stake (coins)">
        <input id="odds" type="number" min="0.1" step="0.1" placeholder="Odds (2 = 2:1)">
      </div>
      <div class="small">At 2:1, the taker risks half your stake to win your full stake.</div>
      <button onclick="makeBet()">Post offer</button>
    </div>

    <h2>Open offers</h2><div id="open"></div>
    <h2>My bets</h2><div id="mine"></div>
    <h2>Leaderboard</h2><div id="board" class="card"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://gsmeyqbwjfnxnigaharo.supabase.co', 'sb_publishable_l8W85pYer3OiYE5acsCRhQ_bCcTWO9z');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null;

sb.auth.onAuthStateChange((_, session) => {
  me = session?.user || null;
  setTimeout(() => {
    $('auth').hidden = !!me;
    $('app').hidden = !me;
    if (me) load();
  }, 0);
});

async function login() {
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('pass').value });
  if (error) alert(error.message);
}
async function signup() {
  const username = $('uname').value.trim();
  if (!username) return alert('Pick a username');
  const { error } = await sb.auth.signUp({ email: $('email').value, password: $('pass').value, options: { data: { username } } });
  if (error) alert(error.message);
}

async function makeBet() {
  const { error } = await sb.rpc('make_bet', {
    p_statement: $('stmt').value, p_stake: parseInt($('stake').value), p_odds: parseFloat($('odds').value)
  });
  if (error) return alert(error.message);
  $('stmt').value = ''; $('stake').value = ''; $('odds').value = '';
  load();
}

async function act(fn, id) {
  const { error } = await sb.rpc(fn, { p_id: id });
  if (error) alert(error.message);
  load();
}

async function load() {
  const [bets, profs] = await Promise.all([
    sb.from('bets').select('*').order('id', { ascending: false }),
    sb.from('profiles').select('id,username')
  ]);
  const name = Object.fromEntries(profs.data.map(p => [p.id, p.username]));
  const all = bets.data;

  const net = Object.fromEntries(profs.data.map(p => [p.id, 0]));
  all.filter(b => b.status === 'settled').forEach(b => {
    const loser = b.winner === b.creator ? b.taker : b.creator;
    net[b.winner] += b.winner === b.creator ? b.taker_stake : b.creator_stake;
    net[loser] -= b.winner === b.creator ? b.taker_stake : b.creator_stake;
  });

  $('who').textContent = name[me.id];
  $('net').textContent = (net[me.id] > 0 ? '+' : '') + net[me.id];
  $('board').innerHTML = Object.entries(net).sort((a, b) => b[1] - a[1])
    .map(([id, n]) => `<div>${esc(name[id])}: ${n > 0 ? '+' : ''}${n}</div>`).join('');

  const card = b => {
    const mine = b.creator === me.id;
    let buttons = '', status = '';
    if (b.status === 'open') {
      buttons = mine
        ? `<button class="grey" onclick="act('cancel_bet',${b.id})">Cancel</button>`
        : `<button onclick="act('take_bet',${b.id})">Take it: risk ${b.taker_stake} to win ${b.creator_stake}</button>`;
    } else if (b.status === 'taken') {
      status = `Taken by ${esc(name[b.taker])}`;
      buttons = `<button class="grey" onclick="if(confirm('Admit you lost?'))act('concede_bet',${b.id})">I lost</button>`;
    } else if (b.status === 'settled') {
      status = `Settled: ${esc(name[b.winner])} won ${b.winner === b.creator ? b.taker_stake : b.creator_stake} coins`;
    }
    return `<div class="card"><b>${esc(name[b.creator])} says:</b> ${esc(b.statement)}
      <div class="small">Creator risks ${b.creator_stake} · Taker risks ${b.taker_stake} (${(b.creator_stake / b.taker_stake).toFixed(2)}:1) ${status ? '· ' + status : ''}</div>
      ${buttons}</div>`;
  };

  $('open').innerHTML = all.filter(b => b.status === 'open').map(card).join('') || '<p class="small">No open offers yet.</p>';
  $('mine').innerHTML = all.filter(b => b.status !== 'cancelled' && b.status !== 'open' && (b.creator === me.id || b.taker === me.id)).map(card).join('') || '<p class="small">Nothing yet.</p>';
}

setInterval(() => { if (me) load(); }, 15000);
</script>
</body>
</html>
